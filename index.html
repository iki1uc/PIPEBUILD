<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PIPEBUILD · Baukern · iki1uc</title>

<style>
    body {
        background:#000;
        color:#0f0;
        font-family:Consolas, monospace;
        padding:20px;
    }
    h1 { color:#6cf; }
    pre {
        background:#111;
        padding:12px;
        border:1px solid #333;
        border-radius:6px;
        color:#0f0;
    }
    .block { margin-bottom:20px; }
</style>

<script type="module">

// =========================
// CSV Loader
// =========================

async function loadCSV(name){
    const res = await fetch(name);
    const text = await res.text();
    return text.split("\n").map(r => r.split(","));
}

// =========================
// ITEM Loader
// =========================

async function loadItem(name){
    const res = await fetch(name);
    return await res.text();
}

// =========================
// PIPEBUILD Start
// =========================

async function PIPEBUILD_START(){

    // Kernmodule
    const pipeline = await import("./Pipeline.js");
    const binder = await import("./binder.js");
    const exporter = await import("./Export.js");

    // UI‑Module
    const id = await loadItem("ID.html");
    const ui = await loadItem("UI.html");
    const scanner = await loadItem("UI-SCANNER.html");

    // UC‑Items
    const fusion01 = await loadItem("uc-fusion-01.item");
    const fusion02 = await loadItem("uc-fusion-02.item");
    const operator = await loadItem("uc-operator.item");
    const posRouter = await loadItem("pos-router.uc.item");

    // CSV‑Daten
    const selektor = await loadCSV("Selektor.csv");
    const loader = await loadCSV("loader.csv");
    const achse7 = await loadCSV("achse-quelle-7.csv");
    const achse7b = await loadCSV("achse-quelle-7 (1).csv");
    const achseZahl3 = await loadCSV("achse-zahl-3.csv");
    const axiom6 = await loadCSV("axiom-dreieck-6.csv");
    const modulFunktion3 = await loadCSV("modul-funktion-3.csv");
    const modulMarkt12 = await loadCSV("modul-marktrolle-12.csv");
    const modulRel0 = await loadCSV("modul-rel-0.csv");
    const nrName6 = await loadCSV("nr-name-6.csv");
    const posAchse0 = await loadCSV("pos-achse-0.csv");
    const raumSymbol7 = await loadCSV("raum-symbol-7.csv");
    const schnitt6 = await loadCSV("schnittstelle-bandbreite-6.csv");
    const tpMarkt5 = await loadCSV("tp-marktrolle-5.csv");
    const mechan4 = await loadCSV("mechanismus-zweck-4.csv");

    return {
        pipeline,
        binder,
        exporter,
        ui: { id, ui, scanner },
        uc: { fusion01, fusion02, operator, posRouter },
        csv: {
            selektor,
            loader,
            achse7,
            achse7b,
            achseZahl3,
            axiom6,
            modulFunktion3,
            modulMarkt12,
            modulRel0,
            nrName6,
            posAchse0,
            raumSymbol7,
            schnitt6,
            tpMarkt5,
            mechan4
        }
    };
}

// =========================
// UI
// =========================

window.onload = async () => {
    const out = await PIPEBUILD_START();
    document.getElementById("out").textContent =
        JSON.stringify(out, null, 2);
};
</script>

</head>

<body>

<h1>PIPEBUILD · Baukern · iki1uc</h1>

<div class="block">
    <pre id="out">Lade PIPEBUILD…</pre>
</div>

</body>
</html>
