<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PIPEBUILD · MASTER-KERN · QI/IQQ · DIAMANT-SPIEGEL</title>

<style>
body{background:#000;color:#0ff;font-family:Consolas, monospace;padding:20px;}
h1,h2{color:#6cf;text-shadow:0 0 12px #6cf;}
section{background:#0b0b0b;border:1px solid #222;padding:15px;margin-bottom:20px;
        border-radius:8px;box-shadow:0 0 12px #004466;}
pre{background:#111;border:1px solid #333;padding:12px;white-space:pre-wrap;}
button{background:#111;color:#0ff;border:1px solid #0ff;padding:10px 20px;margin:5px;}
</style>

<script type="module">

// QI ENGINE
import { QI } from "./QI.js";
import { QI_CSV } from "./QI_CSV.js";

// PIPELINE MODULES
import { P4 } from "./pipelineP4.js";
import { P0 } from "./pipelineP0.js";
import { P1 } from "./pipelineP1.js";
import { P2 } from "./pipelineP2.js";
import { Pe } from "./pipelinePe.js";

// CORE SCAN
import { coreScan } from "./coreScan.js";

// OUTPUT
function out(msg){
    document.getElementById("out").innerText = msg;
}

// QI BUTTONS
window.qi_scan = () => {
    const core = coreScan();
    out("QI · MASTER-KERN\n" + JSON.stringify(QI.scan(core), null, 2));
};

window.qi_os = () => {
    out("QI · OS\n" + JSON.stringify(QI.scan({id:"OS",core:true,fn:true,stable:true}), null, 2));
};

window.qi_respo = () => {
    const core = coreScan();
    out("QI · RESPO\n" + JSON.stringify(QI.scan(core.respo360), null, 2));
};

window.qi_pipe = () => {
    const core = coreScan();
    out("QI · PIPELINE\n" + JSON.stringify(QI.scan(P4.run(core)), null, 2));
};

window.qi_stage = () => {
    out("QI · STAGE\n" + JSON.stringify(QI.scan({id:"STAGE",core:true,fn:true,ready:true}), null, 2));
};

window.qi_404 = () => {
    out("QI · 404\n" + JSON.stringify(QI.scan({id:"404",stable:false,fn:false}), null, 2));
};

// PIPELINE BUTTONS
window.p4_switch = () => {
    const core = coreScan();
    out("P4 · start\n" + JSON.stringify(P4.run(core), null, 2));
};

window.p0_switch = () => {
    const core = coreScan();
    out("P0 · wake\n" + JSON.stringify(P0.run(core), null, 2));
};

window.p1_switch = () => {
    const core = coreScan();
    out("P1 · melt\n" + JSON.stringify(P1.run(core), null, 2));
};

window.p2_switch = () => {
    const core = coreScan();
    out("P2 · merge\n" + JSON.stringify(P2.run(core), null, 2));
};

window.pe_switch = () => {
    const core = coreScan();
    out("Pe · finalize\n" + JSON.stringify(Pe.run(core), null, 2));
};

// CSV LOADER
async function loadCSV(id,file){
    try{
        const txt = await fetch(file).then(r=>r.text());
        document.getElementById(id).textContent = txt;
    }catch{
        document.getElementById(id).textContent = "Fehler: Datei nicht gefunden.";
    }
}

// ITEM LOADER
async function loadItem(id,file){
    try{
        const txt = await fetch(file).then(r=>r.text());
        document.getElementById(id).textContent = txt;
    }catch{
        document.getElementById(id).textContent = "Fehler: ITEM nicht gefunden.";
    }
}

// LOAD ALL
window.onload = () => {

    // CSV
    loadCSV("csv_achse3","achse-zahl-3.csv");
    loadCSV("csv_dreieck6","axiom-dreieck-6.csv");
    loadCSV("csv_mech4","mechanismus-zweck-4.csv");
    loadCSV("csv_achse7","achse-quelle-7.csv");
    loadCSV("csv_funktion3","modul-funktion-3.csv");
    loadCSV("csv_markt12","modul-marktrolle-12.csv");
    loadCSV("csv_raum7","raum-symbol-7.csv");
    loadCSV("csv_band6","schnittstelle-bandbreite-6.csv");
    loadCSV("csv_tp5","tp-marktrolle-5.csv");
    loadCSV("csv_rel0","modul-rel-0.csv");
