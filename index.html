<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>PIPEBUILD · Diamant‑Spiegel · Epochen‑Index</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    padding:20px;
  }

  h1 {
    color:#00eaff;
    text-shadow:0 0 12px #00eaff;
    margin-bottom:20px;
  }

  .epoch {
    border:1px solid #0a1a2a;
    background:#0b1220;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
    box-shadow:0 0 12px #00eaff55;
  }

  .epoch h2 {
    color:#ffaa00;
    margin:0 0 10px 0;
    text-shadow:0 0 12px #ffaa00;
  }

  .entry {
    padding:6px 0;
    border-bottom:1px solid #1f2937;
  }

  button {
    background:#00eaff;
    color:#000;
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    margin-bottom:20px;
  }
</style>
</head>

<body>

<h1>PIPEBUILD · Diamant‑Spiegel · Epochen‑Index</h1>

<button id="load">Alle Epochen laden</button>

<div id="epochen"></div>

<script type="module">

import { loadRAW } from "./loader.csv";
import { bindRAW } from "./binder.js";

async function loadAll(){

    const epochenDiv = document.getElementById("epochen");
    epochenDiv.innerHTML = "";

    // ⭐ RAW-Dateien laden
    const achse = await loadRAW("./achse-quelle-7.csv");
    const modul = await loadRAW("./modul-rel-0.csv");
    const axiom = await loadRAW("./axiom-dreieck-6.csv");
    const pos = await loadRAW("./pos-achse-0.csv");
    const mech = await loadRAW("./mechanismus-zweck-4.csv");

    // ⭐ Epoche 1: Achsen
    addEpoch("Epoche 1 · Achsen", achse.map(a => "Achse: " + a.join(" → ")));

    // ⭐ Epoche 2: Module
    addEpoch("Epoche 2 · Module", modul.map(m => "Modul: " + m.join(" → ")));

    // ⭐ Epoche 3: Axiome
    addEpoch("Epoche 3 · Axiome", axiom.map(ax => "Axiom: " + ax.join(" → ")));

    // ⭐ Epoche 4: Positionen
    addEpoch("Epoche 4 · Positionen", pos.map(p => "Position: " + p.join(" → ")));

    // ⭐ Epoche 5: Mechanismen
    addEpoch("Epoche 5 · Mechanismen", mech.map(m => "Mechanismus: " + m.join(" → ")));

    // ⭐ Epoche 6: Bindungen (Achse ↔ Modul)
    const bindung = bindRAW(
        achse.map(a => a[0]),
        modul.map(m => m[1])
    );

    addEpoch("Epoche 6 · Bindungen", bindung.map(b => `Bindung: ${b.from} → ${b.to}`));

    // ⭐ Epoche 7: Diamant‑Spiegel (Alles zusammen)
    const spiegel = [
        ...achse.map(a => "Achse: " + a.join(" → ")),
        ...modul.map(m => "Modul: " + m.join(" → ")),
        ...axiom.map(ax => "Axiom: " + ax.join(" → ")),
        ...pos.map(p => "Position: " + p.join(" → ")),
        ...mech.map(m => "Mechanismus: " + m.join(" → ")),
        ...bindung.map(b => `Bindung: ${b.from} → ${b.to}`)
    ];

    addEpoch("Epoche 7 · Diamant‑Spiegel · ALLES", spiegel);
}

function addEpoch(title, entries){
    const epochenDiv = document.getElementById("epochen");

    const ep = document.createElement("div");
    ep.className = "epoch";

    const h = document.createElement("h2");
    h.textContent = title;
    ep.appendChild(h);

    entries.forEach(e => {
        const div = document.createElement("div");
        div.className = "entry";
        div.textContent = e;
        ep.appendChild(div);
    });

    epochenDiv.appendChild(ep);
}

document.getElementById("load").onclick = loadAll;

</script>

</body>
</html>
